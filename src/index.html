<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline';">
  <title>Shop - Phần Mềm Bán Hàng</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <!-- Custom Titlebar & Navigation -->
  <header class="titlebar" id="titlebar">
    <div class="titlebar-left">
      <div class="titlebar-brand" onclick="navigateTo('pos')">
        <span class="brand-logo">🛒</span>
        <span class="brand-name">Shop</span>
      </div>
      <div class="top-search-container">
        <svg class="top-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="posSearchInput" placeholder="Nhập mã barcode hoặc tên hàng hóa (F2)" oninput="pageModules.pos && pageModules.pos.onSearch(this.value)">
      </div>
    </div>

    <div class="titlebar-right">
      <!-- Update Notification Badge (MOI-06) -->
      <div class="update-badge-btn" id="updateBadgeBtn" style="display:none;" onclick="openUpdateModal()" title="Có bản cập nhật mới">
        ✨ Bản mới
      </div>

      <div class="scanner-badge-btn" id="scannerStatus" title="Kết nối máy quét điện thoại">
        <span class="status-dot offline"></span>
        <span class="status-text">📱 Máy quét</span>
      </div>
      <div class="store-dropdown" title="Kho chi nhánh">
        Cửa hàng: <strong>Kho 1 ▾</strong>
      </div>
      <div class="shift-badge-btn" id="shiftBadgeBtn" onclick="openShiftManagerModal()" title="Quản lý ca làm việc (Mở ca / Chốt ca)">
        <span class="status-dot online" id="shiftStatusDot"></span>
        <span class="status-text" id="shiftStatusText">Ca bán hàng ▾</span>
      </div>
      <div class="user-profile-badge" id="userProfileBadge" onclick="toggleUserMenu(event)" title="Tài khoản hiện tại - Bấm để đổi ca / khóa màn hình">
        <span class="user-avatar-icon" id="userAvatarIcon">👑</span>
        <span class="user-name" id="userNameLabel">Xin chào, <strong>Chủ Cửa Hàng ▾</strong></span>
      </div>

      <!-- User Profile Dropdown -->
      <div class="user-dropdown-menu" id="userDropdownMenu" style="display:none;">
        <div class="user-dropdown-header">
          <div class="udh-name" id="udhName">Chủ Cửa Hàng</div>
          <div class="udh-role" id="udhRole"><span class="badge badge-success">👑 Chủ Cửa Hàng</span></div>
        </div>
        <div class="user-dropdown-divider"></div>
        <button class="user-dropdown-item" onclick="openShiftManagerModal()">
          <span>💼</span> Quản lý ca / Chốt ca
        </button>
        <button class="user-dropdown-item" onclick="openSwitchUserModal()">
          <span>🔄</span> Đổi tài khoản / Đăng nhập
        </button>
        <button class="user-dropdown-item" onclick="lockScreen()">
          <span>🔒</span> Khóa màn hình
        </button>
        <button class="user-dropdown-item" onclick="openChangePinModal()">
          <span>🔑</span> Đổi mã PIN
        </button>
      </div>

      <!-- Theme Mode Toggle (Light / Dark) -->
      <button class="theme-mode-toggle-btn" id="themeModeToggleBtn" onclick="toggleThemeMode()" title="Chuyển chế độ Sáng / Tối">
        <span class="theme-icon" id="themeModeIcon">🌙</span>
      </button>

      <div class="titlebar-controls">
        <button class="tb-btn" onclick="api.window.minimize()" title="Thu nhỏ">
          <svg width="12" height="12" viewBox="0 0 12 12"><rect y="5" width="12" height="2" fill="currentColor"/></svg>
        </button>
        <button class="tb-btn" onclick="api.window.maximize()" title="Phóng to">
          <svg width="12" height="12" viewBox="0 0 12 12"><rect x="1" y="1" width="10" height="10" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
        </button>
        <button class="tb-btn tb-close" onclick="api.window.close()" title="Đóng">
          <svg width="12" height="12" viewBox="0 0 12 12"><path d="M1 1L11 11M11 1L1 11" stroke="currentColor" stroke-width="1.5"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Lock Screen Overlay -->
  <div class="lock-screen-overlay" id="lockScreenOverlay" style="display:none;">
    <div class="lock-screen-card">
      <div class="lock-avatar">🔒</div>
      <h2 class="lock-title">Màn hình đang khóa</h2>
      <p class="lock-subtitle" id="lockUserName">Vui lòng nhập mã PIN để mở khóa</p>
      
      <div class="pin-display">
        <input type="password" id="lockPinInput" maxlength="6" readonly class="pin-dots-input" placeholder="••••">
      </div>
      
      <div class="numpad-grid">
        <button type="button" class="numpad-btn" onclick="appendLockPin('1')">1</button>
        <button type="button" class="numpad-btn" onclick="appendLockPin('2')">2</button>
        <button type="button" class="numpad-btn" onclick="appendLockPin('3')">3</button>
        <button type="button" class="numpad-btn" onclick="appendLockPin('4')">4</button>
        <button type="button" class="numpad-btn" onclick="appendLockPin('5')">5</button>
        <button type="button" class="numpad-btn" onclick="appendLockPin('6')">6</button>
        <button type="button" class="numpad-btn" onclick="appendLockPin('7')">7</button>
        <button type="button" class="numpad-btn" onclick="appendLockPin('8')">8</button>
        <button type="button" class="numpad-btn" onclick="appendLockPin('9')">9</button>
        <button type="button" class="numpad-btn clear" onclick="clearLockPin()">C</button>
        <button type="button" class="numpad-btn" onclick="appendLockPin('0')">0</button>
        <button type="button" class="numpad-btn ok" onclick="submitUnlock()">OK</button>
      </div>

      <div class="lock-actions">
        <button class="btn btn-outline btn-sm" onclick="openSwitchUserModal(true)">Đổi tài khoản khác</button>
      </div>
    </div>
  </div>

  <!-- App Main Content Area -->
  <div class="app-layout">
    <!-- Collapsible Hover Left Sidebar -->
    <div class="sidebar-wrapper">
      <aside class="sidebar" id="appSidebar">
        <!-- Sidebar Brand / Header -->
        <div class="sidebar-brand" onclick="navigateTo('pos')" title="Shop - Bán hàng">
          <div class="sb-logo-box">
            <span class="sb-logo-icon">🛒</span>
          </div>
          <span class="sb-brand-text">Shop</span>
        </div>

        <!-- Main Navigation Menu (Top) -->
        <nav class="sidebar-menu">
          <button class="sidebar-item active" data-page="pos" onclick="navigateTo('pos')" title="Bán hàng (F1)">
            <svg class="si-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect width="18" height="18" x="3" y="3" rx="2"/>
              <polyline points="7 14 11 10 13 12 17 8"/>
            </svg>
            <span class="si-label">Bán hàng</span>
          </button>

          <button class="sidebar-item" data-page="products" onclick="navigateTo('products')" title="Sản phẩm & Kho hàng (F2)">
            <svg class="si-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="m7.5 4.27 9 5.15"/>
              <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/>
              <path d="m3.3 7 8.7 5 8.7-5"/>
              <path d="M12 22V12"/>
            </svg>
            <span class="si-label">Sản phẩm</span>
          </button>

          <button class="sidebar-item" data-page="orders" onclick="navigateTo('orders')" title="Đơn hàng & Đổi trả (F3)">
            <svg class="si-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
              <rect x="8" y="2" width="8" height="4" rx="1"/>
              <path d="M9 12h6"/>
              <path d="M9 16h6"/>
            </svg>
            <span class="si-label">Đơn hàng</span>
          </button>

          <button class="sidebar-item" data-page="customers" onclick="navigateTo('customers')" title="Khách hàng & Thành viên (F4)">
            <svg class="si-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
            <span class="si-label">Khách hàng</span>
          </button>

          <button class="sidebar-item" data-page="reports" onclick="navigateTo('reports')" title="Báo cáo & Thống kê (F5)">
            <svg class="si-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect width="18" height="18" x="3" y="3" rx="2"/>
              <line x1="8" y1="17" x2="8" y2="12"/>
              <line x1="12" y1="17" x2="12" y2="8"/>
              <line x1="16" y1="17" x2="16" y2="14"/>
            </svg>
            <span class="si-label">Báo cáo</span>
          </button>
        </nav>

        <!-- Spacer to push Settings to the bottom -->
        <div class="sidebar-spacer"></div>

        <!-- Bottom Navigation Menu -->
        <div class="sidebar-bottom">
          <button class="sidebar-item" data-page="settings" onclick="navigateTo('settings')" title="Cài đặt hệ thống">
            <svg class="si-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <span class="si-label">Cài đặt</span>
          </button>
        </div>
      </aside>
    </div>

    <main class="content-area" id="contentArea">
      <!-- Pages loaded dynamically -->
      <div class="page-loading">
        <div class="spinner"></div>
        <p>Đang tải...</p>
      </div>
    </main>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Modal Backdrop -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModal()"></div>
  <div class="modal-container" id="modalContainer"></div>

  <!-- Scripts -->
  <script src="js/plugins.js"></script>
  <script src="js/libs/chart.umd.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pos.js"></script>
  <script src="js/products.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/customers.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/settings.js"></script>
</body>
</html>
